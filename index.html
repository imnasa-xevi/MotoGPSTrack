<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0a0e13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MotoGPSTrack</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Manrope:wght@400;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root{
    --bg:#0a0e13; --bg2:#121821; --card:#161d27; --card2:#1b232f; --border:#26313d;
    --text:#eef4f9; --muted:#7c8a99; --muted2:#546272;
    --accent:#22d3ee; --accent-ink:#04222a;
    --go:#34d399; --done:#94a3b8; --warn:#fbbf24; --danger:#f87171;
    --font-display:'Space Grotesk','Segoe UI',sans-serif; --font-body:'Manrope',-apple-system,sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body);
    font-variant-numeric:tabular-nums;
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
    overscroll-behavior:none;
  }
  h1,h2,h3{font-family:var(--font-display); margin:0;}
  button{font-family:var(--font-body); cursor:pointer;}

  .app{max-width:520px; margin:0 auto; padding:14px 14px calc(14px + env(safe-area-inset-bottom));}

  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .topbar .brand{display:flex; align-items:center; gap:8px;}
  .topbar .brand .dot{width:10px; height:10px; border-radius:50%; background:var(--muted2);}
  .topbar .brand .dot.live{background:var(--go); box-shadow:0 0 0 4px rgba(52,211,153,.22);}
  .topbar h1{font-size:1.05rem; font-weight:700;}
  .topbar .sub{font-size:.7rem; color:var(--muted);}

  .btn{
    background:var(--accent); color:var(--accent-ink); border:none; border-radius:16px;
    font-family:var(--font-display); font-weight:700; font-size:1rem;
    padding:16px; width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn.secondary{background:var(--card); color:var(--text); border:1px solid var(--border);}
  .btn.danger{background:transparent; color:var(--danger); border:1.5px solid var(--danger);}
  .btn:active{filter:brightness(.9);}

  .perm-card{
    background:var(--card); border:1px solid var(--border); border-radius:20px;
    padding:28px 20px; text-align:center; margin-bottom:12px;
  }
  .perm-card .icon{font-size:2.2rem; margin-bottom:10px;}
  .perm-card p{color:var(--muted); font-size:.9rem; line-height:1.55; margin:0 0 18px;}

  .banner{
    background:var(--card); border:1px solid var(--border); border-radius:18px;
    padding:14px 16px; display:none; align-items:center; gap:14px; margin-bottom:10px;
  }
  .banner .b-icon{width:44px; height:44px; border-radius:14px; background:rgba(34,211,238,.12); border:1px solid rgba(34,211,238,.4); display:flex; align-items:center; justify-content:center; font-size:1.3rem; flex:none;}
  .banner .b-dist{font-family:var(--font-display); font-size:1.4rem; font-weight:700; line-height:1;}
  .banner .b-label{font-size:.75rem; color:var(--muted); margin-top:3px;}

  .map-card{position:relative; border-radius:20px; overflow:hidden; border:1px solid var(--border); background:#0d1a1f;}
  .map-card #map{width:100%; height:340px;}
  .map-card.fullscreen{position:fixed; inset:0; z-index:3000; border-radius:0; border:none;}
  .map-card.fullscreen #map{height:100%;}

  /* Objetivos táctiles grandes: pensados para tocar con guantes de moto, no
     iconos pequeños. Todos los controles sobre el mapa son de al menos 56px. */
  .map-chip{
    position:absolute; width:56px; height:56px; border-radius:50%;
    background:rgba(18,24,33,.9); border:1.5px solid var(--border); color:var(--text);
    display:flex; align-items:center; justify-content:center; font-size:1.35rem;
    box-shadow:0 6px 16px rgba(0,0,0,.4);
  }
  .map-card.fullscreen .map-chip{width:64px; height:64px; font-size:1.55rem;}
  .chip-exit{top:12px; left:12px;}
  .chip-overview{top:12px; right:12px;}
  .chip-rotate{bottom:12px; left:12px;}
  .chip-follow{bottom:12px; right:12px; background:var(--accent); color:var(--accent-ink); border:none;}
  .chip-follow.off{background:rgba(18,24,33,.9); color:var(--text); border:1.5px solid var(--border);}
  .map-card.fullscreen .chip-exit{top:calc(12px + env(safe-area-inset-top));}
  .map-card.fullscreen .chip-overview{top:calc(12px + env(safe-area-inset-top));}
  .map-card.fullscreen .chip-rotate{bottom:calc(12px + env(safe-area-inset-bottom));}
  .map-card.fullscreen .chip-follow{bottom:calc(12px + env(safe-area-inset-bottom));}

  .mode-toggle{
    position:absolute; top:12px; left:50%; transform:translateX(-50%);
    display:flex; background:rgba(18,24,33,.9); border:1.5px solid var(--border);
    border-radius:999px; padding:4px; gap:2px; z-index:5;
  }
  .map-card.fullscreen .mode-toggle{top:calc(12px + env(safe-area-inset-top));}
  .mode-toggle button{
    border:none; background:transparent; color:var(--muted);
    font-family:var(--font-display); font-size:.8rem; font-weight:700;
    padding:12px 20px; border-radius:999px; min-width:52px;
  }
  .mode-toggle button.on{background:var(--accent); color:var(--accent-ink);}

  .speed-sign{
    display:none; position:absolute; left:50%; bottom:14px; transform:translateX(-50%);
    width:64px; height:64px; border-radius:50%; background:#fff; border:5px solid var(--danger);
    align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700;
    font-size:1.4rem; color:#111; box-shadow:0 6px 18px rgba(0,0,0,.5); z-index:5;
  }
  .map-card.fullscreen .speed-sign.show{display:flex;}
  .map-card.fullscreen .speed-sign{bottom:calc(14px + env(safe-area-inset-bottom));}

  .wp-dot{width:26px; height:26px; border-radius:50%; border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; color:#04222a; font-weight:800; font-size:.72rem; font-family:var(--font-display);}
  .wp-dot.done{background:var(--done);}
  .wp-dot.current{width:32px; height:32px; background:var(--go); font-size:.85rem;}
  .wp-dot.upcoming{background:var(--accent);}
  .me-dot{width:32px; height:32px; border-radius:50%; background:var(--go); border:3px solid #fff; box-shadow:0 0 0 5px rgba(52,211,153,.28); display:flex; align-items:center; justify-content:center; font-size:16px;}

  .stat-row{display:flex; gap:10px; margin-top:12px;}
  .stat{flex:1; padding:12px 14px; border-radius:16px; background:var(--card); border:1px solid var(--border);}
  .stat .stat-label{font-size:.62rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted2); margin-bottom:4px;}
  .stat .stat-value{font-family:var(--font-display); font-size:1.2rem; font-weight:700;}
  .stat .stat-value .unit{font-size:.6em; color:var(--muted); font-weight:600;}
  .stat .stat-value.accent{color:var(--accent);}
  .stat .stat-value.go{color:var(--go);}

  .session-btns{display:none; gap:8px; margin-top:12px;}

  .toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--card2); border:1px solid var(--border); color:var(--text); padding:12px 18px; border-radius:14px; font-size:.85rem; opacity:0; pointer-events:none; transition:opacity .25s; z-index:5000; max-width:88vw; text-align:center;}
  .toast.show{opacity:1;}

  .maplibregl-ctrl-attrib{font-size:9px !important;}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <span class="dot" id="gpsDot"></span>
      <div>
        <h1 id="routeTitle">MotoGPSTrack</h1>
        <div class="sub" id="routeSub">Cargando ruta…</div>
      </div>
    </div>
  </div>

  <div class="perm-card" id="permCard">
    <div class="icon">📍</div>
    <p>Activa la ubicación para navegar la ruta. Pensado para usarse con guantes: todo son botones grandes.</p>
    <button class="btn" id="btnEnable">Activar ubicación</button>
  </div>

  <div class="session-btns" id="sessionBtns">
    <button class="btn secondary" id="btnPause" style="flex:2;">⏸️ Pausar</button>
    <button class="btn danger" id="btnStop" style="flex:1;">🛑 Terminar</button>
  </div>

  <div class="banner" id="banner">
    <div class="b-icon" id="bIcon">🏁</div>
    <div>
      <div class="b-dist" id="bDist">—</div>
      <div class="b-label" id="bLabel">Esperando posición GPS</div>
    </div>
  </div>

  <div class="map-card" id="mapCard">
    <div id="map"></div>
    <div class="mode-toggle" id="modeToggle">
      <button class="on" data-mode="2d">2D</button>
      <button data-mode="3d">3D</button>
    </div>
    <button class="map-chip chip-exit" id="btnFullscreen" title="Pantalla completa">⛶</button>
    <button class="map-chip chip-overview" id="btnOverview" title="Ver toda la ruta">🗺️</button>
    <button class="map-chip chip-rotate" id="btnRotate" title="Girar mapa según la marcha">🧭</button>
    <button class="map-chip chip-follow" id="btnFollow" title="Seguir mi posición">🎯</button>
    <div class="speed-sign" id="speedSign"><span id="speedSignNum">—</span></div>
  </div>

  <div class="stat-row">
    <div class="stat">
      <div class="stat-label">Velocidad</div>
      <div class="stat-value accent" id="statSpeed">— <span class="unit">km/h</span></div>
    </div>
    <div class="stat">
      <div class="stat-label">Distancia</div>
      <div class="stat-value" id="statDist">— <span class="unit">km</span></div>
    </div>
    <div class="stat">
      <div class="stat-label">Destino</div>
      <div class="stat-value go" id="statNext">—</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
/* ================= Datos de ruta (semilla de demostración) =================
   Misma ruta real que MotoTrack, para poder comparar ambas apps con los
   mismos datos mientras se construye esta. Más adelante esto se sustituye
   por un editor de rutas propio con búsqueda (Photon) y favoritos. */
const PIRINEOS_WAYPOINTS = [
  {name:'Girona (salida)', lat:41.9794, lon:2.8214},
  {name:'Olot', lat:42.1817, lon:2.4900},
  {name:'Ripoll', lat:42.1996, lon:2.1904},
  {name:'Puigcerdà', lat:42.4326, lon:1.9284},
  {name:"La Seu d'Urgell", lat:42.3585, lon:1.4593},
  {name:'Sort', lat:42.4131, lon:1.1290},
  {name:"Esterri d'Àneu", lat:42.6178, lon:1.1240},
  {name:'Port de la Bonaigua', lat:42.6784, lon:0.9880},
  {name:'Vielha', lat:42.7027, lon:0.7967},
  {name:'Bagnères-de-Luchon', lat:42.7897, lon:0.5951},
  {name:'Col de Peyresourde', lat:42.7967, lon:0.4514},
  {name:"Col d'Aspin", lat:42.9309, lon:0.3272},
  {name:'Col du Tourmalet', lat:42.9106, lon:0.1443},
  {name:'Luz-Saint-Sauveur', lat:42.8756, lon:-0.0044},
  {name:'Col du Soulor', lat:42.9814, lon:-0.2278},
  {name:"Col d'Aubisque", lat:42.9847, lon:-0.3392},
  {name:'Eaux-Chaudes / Laruns', lat:42.9861, lon:-0.4139},
  {name:'Col du Pourtalet', lat:42.8083, lon:-0.4394},
  {name:'Formigal', lat:42.7739, lon:-0.3697},
  {name:'Jaca', lat:42.5709, lon:-0.5498},
  {name:'Hecho', lat:42.7280, lon:-0.7460},
  {name:'Ansó', lat:42.7570, lon:-0.7860},
  {name:'Roncal', lat:42.7896, lon:-0.9502},
  {name:'Isaba', lat:42.8760, lon:-0.8825},
];
const ROUTE = PIRINEOS_WAYPOINTS;

/* ================= Utilidades de geometría (idénticas a MotoTrack) ================= */
function haversine(lat1,lon1,lat2,lon2){
  const R=6371, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

/* ================= Estado ================= */
let map = null, lastPos = null, watchId = null, currentIdx = 0, followMode = true;
let is3D = false, mapRotateMode = false, lastGpsHeading = null;
let fullscreenNav = false, wakeLock = null, navPaused = false;
let wpMarkers = [], meMarker = null;
let fullRouteGeoms = new Array(ROUTE.length - 1).fill(null);

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ================= OSRM: geometría real por carretera (igual que MotoTrack) ================= */
async function fetchOsrmRoute(from, to){
  const url = `https://router.project-osrm.org/route/v1/driving/${from.lon},${from.lat};${to.lon},${to.lat}?geometries=geojson&overview=full`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('HTTP '+res.status);
  const data = await res.json();
  if(data.code !== 'Ok' || !data.routes?.length) throw new Error(data.code || 'sin ruta');
  return data.routes[0].geometry.coordinates; // [ [lon,lat], ... ]
}

async function loadFullRouteGeometry(){
  const cacheKey = 'routegeo_pirineos_demo';
  fullRouteGeoms = new Array(ROUTE.length - 1).fill(null);
  try{
    const cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
    if(Array.isArray(cached) && cached.length === ROUTE.length - 1 && cached.every(g => g)){
      fullRouteGeoms = cached;
      renderRouteLayer();
      return;
    }
  }catch(e){}
  for(let i=0;i<ROUTE.length-1;i++){
    try{
      fullRouteGeoms[i] = await fetchOsrmRoute(ROUTE[i], ROUTE[i+1]);
    }catch(e){
      fullRouteGeoms[i] = null;
    }
    renderRouteLayer();
    await sleep(70);
  }
  // Solo se cachea si se consiguieron TODOS los tramos (ver bug ya corregido
  // en MotoTrack: una caché parcial se reutilizaba para siempre).
  if(fullRouteGeoms.every(g => g)){
    try{ localStorage.setItem(cacheKey, JSON.stringify(fullRouteGeoms)); }catch(e){}
  }
}

function renderRouteLayer(){
  if(!map || !map.getSource('route')) return;
  const features = [];
  for(let i=0;i<ROUTE.length-1;i++){
    const coords = fullRouteGeoms[i] || [[ROUTE[i].lon, ROUTE[i].lat], [ROUTE[i+1].lon, ROUTE[i+1].lat]];
    const status = (i+1 < currentIdx) ? 'done' : (i+1 === currentIdx ? 'current' : 'upcoming');
    features.push({type:'Feature', properties:{status}, geometry:{type:'LineString', coordinates:coords}});
  }
  map.getSource('route').setData({type:'FeatureCollection', features});
}

/* ================= Marcadores numerados ================= */
function renderWpMarkers(){
  wpMarkers.forEach(m => m.remove());
  wpMarkers = ROUTE.map((wp, i) => {
    const cls = i < currentIdx ? 'done' : (i === currentIdx ? 'current' : 'upcoming');
    const el = document.createElement('div');
    el.className = 'wp-dot ' + cls;
    el.textContent = i + 1;
    const marker = new maplibregl.Marker({element: el})
      .setLngLat([wp.lon, wp.lat])
      .setPopup(new maplibregl.Popup({offset:16}).setText(`${i+1}. ${wp.name}`))
      .addTo(map);
    return marker;
  });
}
function updateWpMarkerStyles(){
  wpMarkers.forEach((m, i) => {
    const el = m.getElement();
    const cls = i < currentIdx ? 'done' : (i === currentIdx ? 'current' : 'upcoming');
    el.className = 'wp-dot ' + cls;
  });
  renderRouteLayer();
}

/* ================= Mi posición ================= */
function updateMeMarker(lat, lon){
  if(!map) return;
  if(!meMarker){
    const el = document.createElement('div');
    el.className = 'me-dot'; el.textContent = '🏍️';
    meMarker = new maplibregl.Marker({element: el}).setLngLat([lon, lat]).addTo(map);
  } else {
    meMarker.setLngLat([lon, lat]);
  }
  if(followMode){
    map.easeTo({center:[lon, lat], zoom: Math.max(map.getZoom(), 15.5), duration:400});
  }
}

/* ================= Progreso por la ruta ================= */
function advanceIfClose(){
  if(!lastPos || currentIdx >= ROUTE.length) return;
  const wp = ROUTE[currentIdx];
  const d = haversine(lastPos.lat, lastPos.lon, wp.lat, wp.lon);
  if(d < 0.6){ // 600 m
    currentIdx++;
    updateWpMarkerStyles();
    showToast('✓ ' + wp.name);
    if(currentIdx < ROUTE.length) speakIfPossible('Siguiente destino: ' + ROUTE[currentIdx].name);
  }
}
function speakIfPossible(text){
  if(!('speechSynthesis' in window)) return;
  try{
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'es-ES';
    speechSynthesis.speak(u);
  }catch(e){}
}

function updateBannerAndStats(pos){
  const banner = document.getElementById('banner');
  const bIcon = document.getElementById('bIcon'), bDist = document.getElementById('bDist'), bLabel = document.getElementById('bLabel');
  banner.style.display = 'flex';
  if(currentIdx >= ROUTE.length){
    bIcon.textContent = '🏁'; bDist.textContent = '—'; bLabel.textContent = 'Ruta completada';
    document.getElementById('statNext').textContent = '—';
    return;
  }
  const wp = ROUTE[currentIdx];
  const d = haversine(lastPos.lat, lastPos.lon, wp.lat, wp.lon);
  bIcon.textContent = '📍';
  bDist.textContent = d < 1 ? Math.round(d*1000) + ' m' : d.toFixed(1) + ' km';
  bLabel.textContent = 'Hacia ' + wp.name;
  document.getElementById('statNext').textContent = wp.name;
  document.getElementById('statDist').innerHTML = (d < 1 ? Math.round(d*1000)+' m' : d.toFixed(1)) + (d<1 ? '' : ' <span class="unit">km</span>');

  const kmh = (pos.coords.speed !== null && !isNaN(pos.coords.speed)) ? Math.round(pos.coords.speed*3.6) : null;
  document.getElementById('statSpeed').innerHTML = (kmh !== null ? kmh : '—') + ' <span class="unit">km/h</span>';

  const speedSign = document.getElementById('speedSign');
  if(fullscreenNav && kmh !== null){ speedSign.classList.add('show'); document.getElementById('speedSignNum').textContent = kmh; }
  else speedSign.classList.remove('show');
}

/* ================= GPS ================= */
function startWatch(){
  if(!('geolocation' in navigator)){ showToast('Este dispositivo no soporta geolocalización'); return; }
  document.getElementById('permCard').style.display = 'none';
  document.getElementById('sessionBtns').style.display = 'flex';
  watchId = navigator.geolocation.watchPosition(pos => {
    lastPos = {lat:pos.coords.latitude, lon:pos.coords.longitude};
    const h = pos.coords.heading;
    if(h !== null && h !== undefined && !isNaN(h)) lastGpsHeading = h;
    document.getElementById('gpsDot').classList.add('live');
    advanceIfClose();
    updateMeMarker(lastPos.lat, lastPos.lon);
    applyRotation();
    updateBannerAndStats(pos);
    maybeEnsureWakeLock();
  }, err => {
    document.getElementById('gpsDot').classList.remove('live');
    showToast('Sin señal GPS (' + err.message + ')');
  }, {enableHighAccuracy:true, maximumAge:5000, timeout:20000});
}

function applyRotation(){
  if(!map) return;
  if(mapRotateMode && lastGpsHeading !== null) map.setBearing(lastGpsHeading);
  else map.setBearing(0);
}

/* ================= Pantalla siempre encendida ================= */
async function requestWakeLock(){
  if(!('wakeLock' in navigator)) return;
  try{
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  }catch(e){ wakeLock = null; }
}
async function ensureWakeLock(){
  if(wakeLock || navPaused || watchId === null) return;
  await requestWakeLock();
}
let lastWakeLockCheck = 0;
function maybeEnsureWakeLock(){
  if(navPaused || watchId === null) return;
  const now = Date.now();
  if(now - lastWakeLockCheck < 15000) return;
  lastWakeLockCheck = now;
  ensureWakeLock();
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') ensureWakeLock(); });

/* ================= Mapa (MapLibre GL, sin API key: OpenFreeMap + terreno AWS Terrarium) ================= */
function initMap(){
  if(map) return;
  map = new maplibregl.Map({
    container: 'map',
    style: 'https://tiles.openfreemap.org/styles/liberty',
    center: [ROUTE[0].lon, ROUTE[0].lat],
    zoom: 6.5,
    attributionControl: {compact:true}
  });

  map.on('load', () => {
    map.addSource('terrain-dem', {
      type: 'raster-dem',
      tiles: ['https://elevation-tiles-prod.s3.amazonaws.com/terrarium/{z}/{x}/{y}.png'],
      tileSize: 256,
      encoding: 'terrarium',
      maxzoom: 15
    });
    map.addSource('route', {type:'geojson', data:{type:'FeatureCollection', features:[]}});
    map.addLayer({
      id:'route-line', type:'line', source:'route',
      layout:{'line-join':'round','line-cap':'round'},
      paint:{
        'line-color':['match', ['get','status'], 'done','#94a3b8', 'current','#34d399', /*upcoming*/ '#22d3ee'],
        'line-width':['match', ['get','status'], 'current', 6, 4],
        'line-opacity':['match', ['get','status'], 'done', .7, 'current', .95, .8]
      }
    });
    renderWpMarkers();
    renderRouteLayer();
    loadFullRouteGeometry();
    fitToRoute();
  });

  map.on('dragstart', () => setFollow(false));
}

function fitToRoute(){
  if(!map) return;
  const bounds = new maplibregl.LngLatBounds();
  ROUTE.forEach(wp => bounds.extend([wp.lon, wp.lat]));
  if(lastPos) bounds.extend([lastPos.lon, lastPos.lat]);
  map.fitBounds(bounds, {padding:44, duration:500});
}

function setFollow(on){
  followMode = on;
  document.getElementById('btnFollow').classList.toggle('off', !on);
  if(on && lastPos) map.easeTo({center:[lastPos.lon, lastPos.lat], zoom: Math.max(map.getZoom(),15.5)});
}

function set3D(on){
  is3D = on;
  document.querySelectorAll('#modeToggle button').forEach(b => b.classList.toggle('on', b.dataset.mode === (on?'3d':'2d')));
  if(on){
    map.setTerrain({source:'terrain-dem', exaggeration:1.4});
    map.easeTo({pitch:62, duration:500});
  } else {
    map.setTerrain(null);
    map.easeTo({pitch:0, duration:500});
  }
}

function toggleFullscreen(){
  fullscreenNav = !fullscreenNav;
  const card = document.getElementById('mapCard');
  card.classList.toggle('fullscreen', fullscreenNav);
  document.getElementById('btnFullscreen').textContent = fullscreenNav ? '✕' : '⛶';
  setTimeout(() => { if(map) map.resize(); }, 60);
}

/* ================= Eventos UI ================= */
document.getElementById('btnEnable').addEventListener('click', () => {
  requestWakeLock();
  startWatch();
});
document.getElementById('btnPause').addEventListener('click', () => {
  const btn = document.getElementById('btnPause');
  if(!navPaused){
    navPaused = true;
    if(watchId !== null){ navigator.geolocation.clearWatch(watchId); watchId = null; }
    if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock = null; }
    document.getElementById('gpsDot').classList.remove('live');
    btn.textContent = '▶️ Reanudar';
  } else {
    navPaused = false;
    btn.textContent = '⏸️ Pausar';
    startWatch();
    requestWakeLock();
  }
});
document.getElementById('btnStop').addEventListener('click', () => {
  if(!confirm('¿Terminar la navegación? El progreso no se pierde.')) return;
  if(watchId !== null){ navigator.geolocation.clearWatch(watchId); watchId = null; }
  if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock = null; }
  document.getElementById('gpsDot').classList.remove('live');
  document.getElementById('sessionBtns').style.display = 'none';
  document.getElementById('permCard').style.display = 'block';
});
document.getElementById('btnFullscreen').addEventListener('click', toggleFullscreen);
document.getElementById('btnOverview').addEventListener('click', () => { setFollow(false); fitToRoute(); });
document.getElementById('btnFollow').addEventListener('click', () => setFollow(!followMode));
document.getElementById('btnRotate').addEventListener('click', () => {
  mapRotateMode = !mapRotateMode;
  document.getElementById('btnRotate').style.color = mapRotateMode ? 'var(--go)' : '';
  if(mapRotateMode) setFollow(true);
  applyRotation();
});
document.getElementById('modeToggle').addEventListener('click', e => {
  const btn = e.target.closest('button'); if(!btn) return;
  set3D(btn.dataset.mode === '3d');
});

document.getElementById('routeTitle').textContent = 'Pirineos 2026 (demo)';
document.getElementById('routeSub').textContent = ROUTE.length + ' destinos · MotoGPSTrack';

initMap();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
</body>
</html>
